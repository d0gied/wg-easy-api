services:
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:15.4.0
    environment:
      INIT_ENABLED: true
      INIT_USERNAME: admin
      INIT_PASSWORD: secure_password # len >= 12
      INIT_HOST: 0.0.0.0
      INIT_PORT: 51820
      INSECURE: true
    ports:
      - 51821:51821/tcp
    volumes:
      - /lib/modules:/lib/modules:ro
    networks:
      wg:
        ipv4_address: 10.42.42.42
        ipv6_address: fdcc:ad94:bacf:61a3::2a
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv6.conf.all.forwarding=1
      - net.ipv6.conf.default.forwarding=1
    healthcheck:
      test: ["CMD", "wg", "show"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  curl-tests:
    build:
      context: .
      network: host
    command: sh ./tests/curl.sh
    environment: &env
      WG_EASY_USERNAME: admin
      WG_EASY_PASSWORD: secure_password
      WG_EASY_URL: http://wg-easy:51821
    depends_on:
      wg-easy:
        condition: service_healthy
    networks:
      - wg

  python-tests:
    build:
      context: .
      network: host
    command: python -m pytest tests/test_wg_easy.py
    environment: *env
    depends_on:
      wg-easy:
        condition: service_healthy
    networks:
      - wg

networks:
  wg:
    driver: bridge
    enable_ipv6: true
    ipam:
      driver: default
      config:
        - subnet: 10.42.42.0/24
        - subnet: fdcc:ad94:bacf:61a3::/64
